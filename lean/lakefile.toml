name = "ehr"
version = "0.1.0"
defaultTargets = ["Ehr", "ehr", "CommitProtocol"]

[[lean_lib]]
name = "Ehr"

# New host-protocol specifications; checked by default without linking into ehr.
[[lean_lib]]
name = "CommitProtocol"

[[lean_exe]]
name = "ehr"
root = "Main"

[[lean_exe]]
name = "gents"
root = "Ehr.Tools.GenTS"

# Comparator challenge (statements with `sorry`) and solution. Not default targets.
[[lean_lib]]
name = "Statements"

[[lean_lib]]
name = "Solution"

[[lean_exe]]
name = "export-content"
root = "Ehr.Tools.ExportContent"

# Opt-in whole-program kernel proofs and regulation-catalog regressions.
[[lean_lib]]
name = "EhrHeavy"

[[lean_exe]]
name = "profile-goals"
root = "Ehr.Tools.ProfileGoals"

# Offline aggregate role-calibration attempts; never certifies or deploys layouts.
[[lean_exe]]
name = "role-calibration"
root = "Ehr.Tools.RoleCalibration"

[[lean_exe]]
name = "completion-bench"
root = "Ehr.Tools.CompletionBench"

# Reviewer audit only; deliberately absent from defaultTargets.
[[lean_lib]]
name = "VerificationAudit"
roots = ["Audit.SpecSurface"]

# Exact unproved general T1 proposition, for opt-in proof development only.
[[lean_lib]]
name = "CompletionObligations"

# Isolated round-two research API; not the clinical CLI.
[[lean_exe]]
name = "exotic-api"
root = "Ehr.Sem.ExoticMain"

# Isolated integer-layout research harness; not the clinical painter or gate.
[[lean_exe]]
name = "ui-layout"
root = "Ehr.Layout.Main"

[[lean_exe]]
name = "ui-port-audit"
root = "Ehr.Layout.Audit"
