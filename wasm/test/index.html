<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lean 4.35 → WASM: synchronous step</title>
<style>
  body { font: 16px system-ui; max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
  textarea { box-sizing: border-box; width: 100%; min-height: 8rem; font: 15px monospace; }
  button { margin: 1rem 0; padding: .6rem 1rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #eef3f7; padding: 1rem; }
</style>
<h1>Lean 4.35 in your browser</h1>
<p>JSON is parsed, the counter is incremented, and JSON is rendered by compiled Lean.</p>
<label for="input">JSON input</label>
<textarea id="input">{"counter":41,"message":"Hello 🩺"}</textarea>
<button id="step" disabled>Call step synchronously</button>
<p id="status" role="status">Loading WebAssembly…</p>
<pre id="output"></pre>
<script type="module">
  import { loadEhr } from '../dist/ehr.js';
  const status = document.querySelector('#status');
  const output = document.querySelector('#output');
  const button = document.querySelector('#step');
  const input = document.querySelector('#input');
  try {
    const loading = performance.now();
    const ehr = await loadEhr();
    const loadMs = performance.now() - loading;
    window.ehr = ehr;
    function step() {
      const start = performance.now();
      const result = ehr.step(input.value);
      const elapsed = performance.now() - start;
      output.textContent = JSON.stringify(JSON.parse(result), null, 2);
      status.textContent = `Ready. Synchronous call: ${elapsed.toFixed(3)} ms. Load + init: ${loadMs.toFixed(1)} ms.`;
      window.__ehrResult = { result, elapsed, loadMs, synchronous: typeof result === 'string' };
    }
    button.disabled = false;
    button.addEventListener('click', step);
    step();
  } catch (error) {
    status.textContent = `Failed: ${error.message}`;
    window.__ehrError = String(error);
    console.error(error);
  }
</script>
</html>
