name: Lean toolchain and build cache
description: Restore the pinned elan toolchain and source-keyed Lake outputs
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.elan
        key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('lean/lean-toolchain') }}
    - name: Install pinned Lean
      shell: bash
      run: |
        if [ ! -x "$HOME/.elan/bin/elan" ]; then
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o "$TMPDIR/elan-init.sh"
          sh "$TMPDIR/elan-init.sh" -y --default-toolchain none
        fi
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
    - uses: actions/cache@v4
      with:
        path: lean/.lake
        key: ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-${{ hashFiles('lean/**/*.lean') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-
