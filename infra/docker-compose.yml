# Isolated local authority. No external FHIR server or second clinical writer.
name: vgi-commit
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: vgi
      POSTGRES_PASSWORD: vgi-dev-only
      POSTGRES_DB: vgi_commit
    ports:
      - '127.0.0.1:${COMMIT_PG_PORT:-55532}:5432'
    volumes:
      - commit-postgres-data:/var/lib/postgresql/data
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=32', '-c', 'synchronous_commit=on']
    mem_limit: 320m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vgi -d vgi_commit']
      interval: 2s
      timeout: 2s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ['start-dev', '--import-realm']
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-18180}:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: vgi-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run make setup}
      KEYCLOAK_PERSONA_PASSWORD: ${KEYCLOAK_PERSONA_PASSWORD:?Run make setup}
      KEYCLOAK_4WEST_PASSWORD: ${KEYCLOAK_4WEST_PASSWORD:?Run make setup}
      KC_HOSTNAME: ${KEYCLOAK_BASE_URL:-http://localhost:18180}
      JAVA_OPTS_KC_HEAP: '-Xms128m -Xmx384m'
    volumes:
      - ./keycloak/vgi-realm.json:/opt/keycloak/data/import/vgi-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    mem_limit: 768m
  commit:
    image: node:22.18.0-bookworm-slim
    working_dir: /workspace
    command: ['node', '--experimental-strip-types', 'services/commit/src/main.ts']
    environment:
      DATABASE_URL: postgres://vgi:vgi-dev-only@postgres:5432/vgi_commit
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/vgi/protocol/openid-connect/certs
      COMMIT_CONFIG: /workspace/.cache/commit/config.json
      EHR_BIN: /workspace/lean/.lake/build/bin/ehr
      HOST: 0.0.0.0
      PORT: 8090
    ports:
      - '127.0.0.1:${COMMIT_PORT:-18090}:8090'
    volumes:
      - ../:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    profiles: ['app']
volumes:
  commit-postgres-data:
  keycloak-data:
