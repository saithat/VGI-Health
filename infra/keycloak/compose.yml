name: vgi-keycloak
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ['start-dev', '--import-realm']
    ports:
      - '127.0.0.1:18180:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: vgi-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run node infra/keycloak/setup.mjs}
      KEYCLOAK_PERSONA_PASSWORD: ${KEYCLOAK_PERSONA_PASSWORD:?Run node infra/keycloak/setup.mjs}
      KEYCLOAK_4WEST_PASSWORD: ${KEYCLOAK_4WEST_PASSWORD:?Run node infra/keycloak/setup.mjs}
      KC_HOSTNAME: http://localhost:18180
      JAVA_OPTS_KC_HEAP: '-Xms128m -Xmx384m'
    volumes:
      - ./vgi-realm.json:/opt/keycloak/data/import/vgi-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    mem_limit: 768m
volumes:
  keycloak-data:
